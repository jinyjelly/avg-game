<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>양궁 챌린지</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8cc4ec;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,20,35,.55);z-index:5}
#ov.hide{display:none}
#mute{position:fixed;right:12px;bottom:14px;z-index:4;width:42px;height:42px;border-radius:50%;border:0;background:rgba(10,25,45,.55);font-size:20px;line-height:42px;padding:0}
.card{max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:24px 22px;width:min(84vw,340px);text-align:center;box-shadow:0 10px 40px #0005}
.card h1{margin:0 0 6px;font-size:24px}
.card p{margin:6px 0;color:#444;line-height:1.5;font-size:15px}
.card .big{font-size:36px;font-weight:800;color:#111;margin:8px 0}
.card button{margin-top:14px;border:0;background:#e5322d;color:#fff;font-size:17px;font-weight:700;padding:12px 30px;border-radius:999px}

#tv{position:fixed;inset:0;z-index:8;background:#f4f6f9;overflow:auto;display:none;color:#1b2330;touch-action:auto;-webkit-user-select:text;user-select:text}
#tv header{background:#14324a;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:2}
#tv header h2{margin:0;font-size:18px}
#tv .live{font-size:12px;opacity:.85}
#tv .live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ddc84;margin-right:5px}
#tv main{max-width:1000px;margin:0 auto;padding:12px}
#tv .bx{background:#fff;border:1px solid #e3e7ee;border-radius:14px;padding:14px;margin-bottom:12px}
#tv .bx h3{margin:0 0 8px;font-size:15px}
#tv .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
#tv .k{background:#fff;border:1px solid #e3e7ee;border-radius:14px;padding:12px}
#tv .k .l{font-size:12px;color:#6b7685}#tv .k .v{font-size:26px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}#tv .k .s{font-size:11px;color:#6b7685;min-height:14px}
#tv table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
#tv th,#tv td{padding:8px 6px;border-bottom:1px solid #e3e7ee;text-align:right;font-size:14px;white-space:nowrap}
#tv th{font-size:12px;color:#6b7685;font-weight:600}
#tv th.L,#tv td.L{text-align:left}
#tv td.b{font-weight:800}
#tv tr.fl td{animation:tvfl 2.5s ease-out}@keyframes tvfl{from{background:#fff3b8}to{background:transparent}}
#tv .seg{display:inline-flex;background:#e8edf3;border-radius:999px;padding:3px;margin:0 6px 8px 0}
#tv .seg button{border:0;background:transparent;color:#1b2330;font-weight:600;font-size:13px;padding:6px 11px;border-radius:999px}
#tv .seg button.on{background:#fff;box-shadow:0 1px 3px #0002}
#tv .tb{border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;background:#ffffff22;color:#fff}
#tv .gb{border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;background:#2e9e5b;color:#fff}
#tv .feed div{padding:6px 0;border-bottom:1px solid #e3e7ee;font-size:14px;display:flex;gap:8px}
#tv .st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#tv .st div{background:#f4f6f9;border-radius:10px;padding:10px}
#tv .st b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
#tv .scroll{overflow-x:auto}
@media(max-width:700px){#tv .kp{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<canvas id="c"></canvas>
<button id="mute" aria-label="소리 켜기/끄기">🔊</button>
<div id="tv"></div>
<div id="ov"><div class="card"><h1 id="ovT"></h1><div id="ovB"></div><button id="ovBtn"></button></div></div>
<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');

function env(g,t0,a,p,d){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(p,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);}
function nz(t0,type,freq,Q,peak,a,dec){const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=Q;
  const g=AC.createGain();env(g,t0,a,peak,dec);s.connect(f);f.connect(g);g.connect(master);s.start(t0,Math.random()*2);s.stop(t0+a+dec+0.05);return{f,g};}
function osc(t0,type,f0,f1,peak,a,dec){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+a+dec);
  const g=AC.createGain();env(g,t0,a,peak,dec);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+a+dec+0.05);}
function voice(t0,f,dur,peak,glide,bp){const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f,t0);o.frequency.linearRampToValueAtTime(f*glide,t0+dur*0.5);o.frequency.linearRampToValueAtTime(f*glide*0.93,t0+dur);
  const v=AC.createOscillator();v.frequency.value=rnd(4,7);const vg=AC.createGain();vg.gain.value=f*0.025;v.connect(vg);vg.connect(o.frequency);
  const b=AC.createBiquadFilter();b.type='bandpass';b.frequency.value=bp*rnd(0.8,1.2);b.Q.value=2;
  const g=AC.createGain();env(g,t0,rnd(0.08,0.3),peak,dur);o.connect(b);b.connect(g);g.connect(master);o.start(t0);v.start(t0);o.stop(t0+dur+0.5);v.stop(t0+dur+0.5);}
function claps(t0,dur,n,peak){for(let i=0;i<n;i++){const tt=t0+Math.pow(Math.random(),1.6)*dur;nz(tt,'bandpass',rnd(900,2600),1.3,peak*rnd(0.3,1),0.001,0.045);}}
function whistle(t0){const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(1700,t0);o.frequency.linearRampToValueAtTime(2700,t0+0.25);o.frequency.linearRampToValueAtTime(2100,t0+0.6);
  const g=AC.createGain();env(g,t0,0.05,0.06,0.6);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+0.75);}
function cheer(t0,lv){const dur=1.2+lv*2.2;nz(t0,'bandpass',1000,0.6,0.05+0.22*lv,0.15,dur);nz(t0,'bandpass',2400,1.2,0.02+0.1*lv,0.2,dur);
  for(let i=0;i<Math.round(4+lv*10);i++)voice(t0+rnd(0,0.25),rnd(260,560),dur*rnd(0.6,1),0.035,rnd(1.08,1.25),rnd(800,1300));}
function groan(t0){for(let i=0;i<9;i++)voice(t0+rnd(0,0.15),rnd(150,260),rnd(0.9,1.4),0.035,0.72,rnd(400,650));}

  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=600;f.Q.value=7;const am=AC.createGain();am.gain.value=0.5;

  const g=AC.createGain();g.gain.value=0;s.connect(f);f.connect(am);am.connect(g);g.connect(master);s.start(n);l.start(n);creak={s,f,l,g};}

function newWind(){const s=G&&G.real?(Math.random()<0.1?rnd(0,1):rnd(1,7)):(Math.random()<0.15?rnd(0,1):rnd(0.5,5.5));wind.ph=rnd(0,9);wind.s=Math.round(s*10)/10;

function sway(){let A,tr=0;if(G.real){const f=Math.min(hold,5)/5;A=0.04+0.1*f;tr=0.007+0.012*f;}else{const f=Math.min(hold,8)/8;A=(0.03+0.07*f)*(0.5+0.5*G.dist/70);}
  return{x:A*(Math.sin(t*1.3)+0.6*Math.sin(t*2.9+1.7))+tr*Math.sin(t*23),y:A*(Math.cos(t*1.05)+0.6*Math.sin(t*3.3+0.4))+tr*Math.sin(t*31+2)};}

function shoot(who){
  let ax,ay;const w=CW();
  if(HU(who)){ax=cam.x;ay=cam.y;G.recoil=1;draw=0;full=false;}
  else{const comp=G.real?rnd(0.75,1.15):rnd(0.8,1.1),sig=G.real?0.1:0.06+0.03*G.dist/70;
    ax=-Math.cos(w.a)*w.s*Kw()*comp+gauss()*sig;ay=-Math.sin(w.a)*w.s*Kw()*comp+gauss()*sig;}
  const g=w.s*Kw()*(G.real?rnd(0.85,1.15):rnd(0.92,1.08)),rj=HU(who)?(G.real?0.035:0.02):0.012;
  const hx=ax+Math.cos(w.a)*g+gauss()*rj,hy=ay+Math.sin(w.a)*g+gauss()*rj;
  G.flight={who,x:hx,y:hy,t:0,dur:G.real?1.15:0.3+G.dist/180,sc:scoreOf(hx,hy)};G.state='flying';sndRelease(G.flight.dur,HU(who)?1:0.35);

function endSet(){
  const p=sum(G.pSet),a=sum(G.aSet);let m;
  if(p>a){G.pSP+=2;m=G.two?ES(NM('p'))+' 세트 승리! 🎯':'세트 승리! 🎯';}else if(p<a){G.aSP+=2;m=G.two?ES(NM('a'))+' 세트 승리! 🎯':'세트 패배';}else{G.pSP++;G.aSP++;m='무승부 (1점씩)';}

  else if(G.pSP===5&&G.aSP===5){overlay(`${G.set}세트 결과`,body+'<p>5:5 동점 — <b>슛오프!</b><br>70m 한 발 승부, 같은 점수면 중앙에 더 가까운 쪽 승리</p>','슛오프 시작',()=>{G.shootOff=true;G.set='슛오프';startSet();});}

function resolveShootOff(){
  const p=G.pSet[0],a=G.aSet[0];const win=p.v>a.v||(p.v===a.v&&p.d<a.d);

let prevDraw=0;
function update(dt){t+=dt;if(holding&&!full){creakSet(Math.abs(draw-prevDraw)/Math.max(dt,0.001));}prevDraw=draw;
  if(holding&&full)hold+=dt;
  if(!holding&&!full&&draw>0)draw=Math.max(0,draw-dt*3);
  // 카메라(= 조준기 핀이 가리키는 곳)
  let tz,tX,tY,k;
  if(HU(G.turn)&&G.state==='aim'){const e=ease(draw),s=sway(),m=0.3+0.7*e;tz=0.22+0.78*e;tX=aim.x+s.x*m;tY=aim.y+s.y*m;k=10;}
  else if(G.state==='flying'&&HU(G.flight.who)){tz=cam.z;tX=cam.x;tY=cam.y;k=0;}
  else{tz=0.75;tX=0;tY=0.05;k=3;}
  const a=1-Math.exp(-dt*k);cam.z+=(tz-cam.z)*a;cam.x+=(tX-cam.x)*a;cam.y+=(tY-cam.y)*a;
  const up=HU(G.turn)&&(G.state==='aim'||G.state==='flying');bowLow+=((up?0:1)-bowLow)*(1-Math.exp(-dt*5));
  G.recoil=Math.max(0,G.recoil-dt*3);
  if(G.real&&HU(G.turn)&&G.state==='aim'&&ov.classList.contains('hide')){G.clock-=dt;const c=Math.ceil(G.clock);

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const PC='#ff7a1a',AIC='#a06bff';

function otxt(s,x,y,size,color){ctx.font=`800 ${size}px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='#000a';ctx.strokeText(s,x,y);ctx.fillStyle=color;ctx.fillText(s,x,y);}
function drawNock(x,y,s,who){

  const c=who==='p'?PC:AIC;ctx.strokeStyle=c;ctx.lineWidth=Math.max(2,s*0.5);ctx.lineCap='round';
  for(let k=0;k<3;k++){const an=-Math.PI/2+k*2*Math.PI/3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(an)*s*1.6,y+Math.sin(an)*s*1.6);ctx.stroke();}
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x,y,s*0.55,0,7);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,s*0.32,0,7);ctx.fill();
}
function world(){const wind=CW();
  const Rc=Rf()*cam.z,tx=sx-cam.x*Rc,ty=sy-cam.y*Rc,P=(x,y)=>[tx+x*Rc,ty+y*Rc];

  const gl=ty+Rc*1.75;
  ctx.fillStyle='#3d7a4a';ctx.beginPath();ctx.moveTo(0,Math.max(gl,0)+2);
  for(let x=0;x<=W+12;x+=12){const u=(x-tx)/Rc;ctx.lineTo(x,gl-Rc*(0.6+0.12*Math.sin(u*1.3)+0.07*Math.sin(u*3.1+1)));}
  ctx.lineTo(W,Math.max(gl,0)+2);ctx.fill();
  g=ctx.createLinearGradient(0,gl,0,H);g.addColorStop(0,'#78b955');g.addColorStop(1,'#3b8432');ctx.fillStyle=g;ctx.fillRect(0,gl,W,H-gl);
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;
  for(let k=-3;k<=3;k++){if(!k)continue;ctx.beginPath();ctx.moveTo(tx+k*Rc*1.7,gl);ctx.lineTo(sx+k*W*0.55-cam.x*W*0.2,H+20);ctx.stroke();}
  // 바람 깃발
  for(const fx of[-2.7,2.7]){const[px,py]=P(fx,1.75),[,qy]=P(fx,-1.6);
    ctx.strokeStyle='#eee';ctx.lineWidth=Math.max(1.5,Rc*0.03);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,qy);ctx.stroke();
    const dir=Math.cos(wind.a)>=0?1:-1,len=Rc*(0.15+0.12*Math.min(wind.s,5.5)),droop=Rc*0.5*(1-Math.min(wind.s,4)/4);
    const wv=Math.sin(t*(4+wind.s*1.5))*Rc*0.04;
    ctx.fillStyle='#ffcf2e';ctx.beginPath();ctx.moveTo(px,qy);ctx.lineTo(px+dir*len,qy+Rc*0.08+droop+wv);ctx.lineTo(px,qy+Rc*0.22);ctx.fill();}

function drawBow(){

  const tipT={x:rx+U*0.07+e*U*0.03,y:-H*0.06},tipB={x:rx+U*0.07+e*U*0.03,y:H*1.06};
  const rest={x:rx+U*0.035,y:sy+U*0.07},nockFull={x:sx+U*0.3,y:H*0.97};
  const nockRest={x:tipT.x,y:sy+H*0.1},nock={x:nockRest.x+(nockFull.x-nockRest.x)*e,y:nockRest.y+(nockFull.y-nockRest.y)*e};

  const limb=(a,c,b)=>{ctx.lineCap='round';ctx.strokeStyle='#15161a';ctx.lineWidth=U*0.028;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(c.x,c.y,b.x,b.y);ctx.stroke();
    ctx.strokeStyle='#4a4f5c';ctx.lineWidth=U*0.008;ctx.stroke();};
  limb({x:rx,y:top},{x:rx-U*0.1-e*U*0.03,y:(top+tipT.y)/2},tipT);
  limb({x:rx,y:bot},{x:rx-U*0.1-e*U*0.03,y:(bot+tipB.y)/2},tipB);
  // 시위
  ctx.strokeStyle='rgba(250,250,250,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(tipT.x,tipT.y);ctx.lineTo(nock.x,nock.y);ctx.lineTo(tipB.x,tipB.y);ctx.stroke();

    ctx.strokeStyle='#e9e9e9';ctx.lineWidth=U*0.008;ctx.stroke();

      ctx.moveTo(nock.x+(tip.x-nock.x)*f0,nock.y+(tip.y-nock.y)*f0);ctx.lineTo(nock.x+(tip.x-nock.x)*(f0+0.035),nock.y+(tip.y-nock.y)*(f0+0.035));ctx.stroke();}
    ctx.fillStyle='#888';ctx.beginPath();ctx.arc(tip.x,tip.y,U*0.01,0,7);ctx.fill();}
  // 손잡이(라이저)
  let g=ctx.createLinearGradient(rx-U*0.03,0,rx+U*0.03,0);g.addColorStop(0,'#2a2d34');g.addColorStop(0.5,'#6d7380');g.addColorStop(1,'#1d1f24');
  ctx.fillStyle=g;rr(rx-U*0.025,top,U*0.05,bot-top,U*0.02);ctx.fill();

  ctx.fillRect(sx-U*0.006,sy+sr*0.85,U*0.012,sr*0.3);
  ctx.fillStyle='rgba(170,215,255,.10)';ctx.beginPath();ctx.arc(sx,sy,sr,0,7);ctx.fill();
  ctx.strokeStyle='#1d1f24';ctx.lineWidth=U*0.012;ctx.stroke();
  ctx.strokeStyle='rgba(0,255,120,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(sx,sy+sr);ctx.lineTo(sx,sy+4);ctx.stroke();
  ctx.fillStyle=full?'#ff2d2d':'#2dff7a';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(sx,sy,U*0.009,0,7);ctx.fill();ctx.shadowBlur=0;
  // 활 잡은 손 + 팔

  ctx.fillStyle='#e8b48f';ctx.beginPath();ctx.ellipse(rx-U*0.01,grip,U*0.045,U*0.06,0,0,7);ctx.fill();

    ctx.fillStyle='#3a2a20';ctx.beginPath();ctx.ellipse(nock.x,nock.y,U*0.025,U*0.02,-0.5,0,7);ctx.fill();}

function hud(){const wind=CW();
  ctx.fillStyle='rgba(10,25,45,.6)';rr(8,8,W-16,100,14);ctx.fill();

    txt(NM(who).slice(0,7),x0,28,15,col,al);txt(String(sp),x0,66,30,'#fff',al);

    txt('합계 '+sum(set),left?56:W-56,92,12,'#cfe3f5',al);};

  }else{side('p',true);side('a',false);}
  txt(G.practice?'10발 연습':(typeof G.set==='number'?G.set+'세트':G.set)+' · '+G.dist+'m',sx,24,14,'#fff');
  const wy=56,wr=19;ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(sx,wy,wr,0,7);ctx.stroke();
  if(wind.s>0.05){const L=wr*(0.35+0.65*Math.min(wind.s,5.5)/5.5),ca=Math.cos(wind.a),sa=Math.sin(wind.a),ex=sx+ca*L,ey=wy+sa*L;
    const c=wind.s<2?'#7CFC9A':wind.s<4?'#ffd54a':'#ff6b5a';ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(sx-ca*L,wy-sa*L);ctx.lineTo(ex,ey);ctx.stroke();

  // 학생당 첫 번째(유일한) 기록만 사용
  const first=new Map();for(const r of TV.rows.slice().sort((a,b)=>a.t-b.t))if(!first.has(key(r)))first.set(key(r),r);
  const R=[...first.values()].filter(r=>(TV.fT==='all'||r.t>=t0.getTime())&&(!TV.fD||String(r.dist)===TV.fD));
  const st=R.map(r=>{const sh=(r.shots||[]).filter(x=>x!=='').map(shotVal);return{k:key(r),num:r.num,name:r.name,total:r.total,avg:r.total/10,sd:sh.length?Math.sqrt(pvar(sh)):0,shots:r.shots||[],t:r.t};});
  // 순위: 평균 높은 순 → 같으면 표준편차 작은 순 (둘 다 같으면 같은 등수)
  st.sort((a,b)=>(b.avg-a.avg)||(a.sd-b.sd));
  const same=(a,b)=>Math.abs(a.avg-b.avg)<1e-9&&Math.abs(a.sd-b.sd)<1e-9;
  let rank=0;st.forEach((s,i)=>{if(i===0||!same(s,st[i-1]))rank=i+1;s.rank=rank;});
  // KPI
  const P=(TV.players||[]);
  $('k1').textContent=Math.max(P.length,st.length);$('k1s').textContent='10발 완료 '+st.length+'명';
  if(st.length){const A=st.map(s=>s.avg),top=st[0],tens=R.reduce((s,r)=>s+(r.tens||0),0);
    $('k2').textContent=mean(A).toFixed(2);$('k2s').textContent='합계 평균 '+(mean(A)*10).toFixed(1)+'점';
    $('k3').textContent=TV.showRank?top.avg.toFixed(1):'🔒';$('k3s').textContent=TV.showRank?(top.num?top.num+' ':'')+top.name:'순위 보기를 누르면 공개';
    $('k4').textContent=Math.round(tens/(R.length*10)*100)+'%';$('k4s').textContent=tens+'발 / '+R.length*10+'발';}
  else{['k2','k3','k4'].forEach(k=>$(k).textContent='–');['k2s','k3s','k4s'].forEach(k=>$(k).textContent='');}
  const med=r=>r===1?'🥇':r===2?'🥈':r===3?'🥉':r;
  $('tvH').innerHTML='<th class="L">등수</th><th class="L">학번</th><th class="L">이름</th><th>평균</th><th>표준편차</th><th>합계</th><th class="L">화살</th>';
  const fresh=new Set();for(const r of R){const id=r.t+'|'+key(r);if(!TV.seen.has(id)){TV.seen.add(id);if(!TV.first)fresh.add(key(r));}}
  $('tvB').innerHTML=st.map(s=>`<tr class="${fresh.has(s.k)?'fl':''}"><td class="L" style="font-size:16px">${med(s.rank)}</td><td class="L">${ES(s.num||'')}</td><td class="L">${ES(s.name)}</td><td class="b">${s.avg.toFixed(1)}</td><td>${s.sd.toFixed(2)}</td><td>${s.total}</td><td class="L" style="font-size:12px;color:#444">${s.shots.map(ES).join(' ')}</td></tr>`).join('');
  $('tvE').style.display=st.length?'none':'';
  // 분산·표준편차 (학생 1명 = 평균 1개)
  const sp=$('tvSt');sp.style.display=TV.stats?'':'none';
  if(TV.stats){if(!st.length)sp.innerHTML='<p style="color:#6b7685">10발을 다 쏜 학생이 있어야 계산할 수 있어요</p>';else{
    const A=st.map(s=>s.avg),m=mean(A),va=pvar(A),T=st.map(s=>s.total),mt=mean(T),vt=pvar(T);
    sp.innerHTML=`<p style="font-size:13px;color:#6b7685;margin:0 0 6px">학생 ${A.length}명의 <b>평균(한 발)</b> 기준</p>
     <div class="st"><div>평균<b>${m.toFixed(2)}</b></div><div>분산<b>${va.toFixed(3)}</b></div><div>표준편차<b>${Math.sqrt(va).toFixed(3)}</b></div></div>
     <p style="font-size:13px;color:#6b7685;margin:10px 0 6px">학생 ${T.length}명의 <b>합계(100점 만점)</b> 기준</p>
     <div class="st"><div>평균<b>${mt.toFixed(2)}</b></div><div>분산<b>${vt.toFixed(2)}</b></div><div>표준편차<b>${Math.sqrt(vt).toFixed(2)}</b></div></div>
     <p style="font-size:12px;color:#6b7685;margin-top:8px">분산 = (각 값 − 평균)²의 평균 (모집단 기준, n으로 나눔). 순위표의 '표준편차'는 그 학생이 쏜 화살 10발 점수(X=10, M=0)의 표준편차예요. 작을수록 고르게 쏜 거예요.</p>`;}}
  const hm=t=>new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
  $('tvF').innerHTML=R.slice().sort((a,b)=>b.t-a.t).slice(0,12).map(r=>`<div><span style="color:#6b7685;width:44px">${hm(r.t)}</span><span>${ES((r.num?r.num+' ':'')+r.name)} <span style="color:#6b7685">${r.dist}m</span></span><b style="margin-left:auto">${r.total}</b></div>`).join('')||'<p style="color:#6b7685;text-align:center">–</p>';
  // 참여 명단
  const PL=P.slice(),doneBy=new Set(TV.rows.map(key));
  const nv=x=>{const n=parseFloat(x.num);return isNaN(n)?1e9:n;};PL.sort((a,b)=>nv(a)-nv(b)||String(a.name).localeCompare(String(b.name),'ko'));
  const now=Date.now(),stt=p=>doneBy.has(key(p))||p.n>=10?'<span style="color:#2e9e5b;font-weight:700">✅ 10발 완료</span>':p.n>0?(now-(p.at||0)<180000?'<span style="color:#e08a00;font-weight:700">🏹 쏘는 중 '+p.n+'/10</span>':'<span style="color:#6b7685">멈춤 '+p.n+'/10</span>'):'<span style="color:#6b7685">입장</span>';
  $('tvP').innerHTML=PL.map(p=>`<tr><td class="L">${ES(p.num||'')}</td><td class="L">${ES(p.name||'')}</td><td class="L">${stt(p)}</td><td class="L" style="font-size:12px;color:#444">${(p.shots||[]).map(ES).join(' ')}</td><td class="b">${p.total||0}</td><td>${doneBy.has(key(p))?'✅':'–'}</td></tr>`).join('');
  $('tvPe').style.display=PL.length?'none':'';$('tvPc').textContent=PL.length?PL.length+'명 · 완료 '+st.length+'명':'';
  TV.first=false;
}
function menu(){if(ROOM){roomMenu();return;}
  overlay('🏹 양궁 챌린지',`<p>① 화면을 누른 채 <b>아래로 끌어</b> 시위를 당기고<br>② 핀이 <b>빨개지면</b> 움직여 겨눈 뒤<br>③ <b>손을 떼면 발사!</b></p>
  <p>바람 반대쪽으로 보정하고, 오래 버티면 팔이 떨려요.</p>
  <button id="mT" style="margin-top:8px;padding:8px 18px;font-size:14px;background:#eef2f7;color:#333">🔊 소리 테스트</button><p id="mTr" style="font-size:12px;margin:4px 0 0;color:#666"></p>
  <div style="display:flex;gap:8px;margin-top:12px"><button id="cJ" style="flex:1;margin:0;padding:13px 0;background:#2e9e5b">🏫 수업 입장</button><button id="cT" style="flex:1;margin:0;padding:13px 0;background:#14324a">🔒 선생님</button></div>
  <p style="margin-top:12px;font-weight:800;color:#111">🎯 10발 연습</p><div style="display:flex;gap:8px">${[70,100].map(d=>`<button class="pd" data-d="${d}" style="flex:1;margin-top:4px;padding:12px 0;background:#2e9e5b">${d}m</button>`).join('')}</div><p style="font-size:13px;margin:4px 0 0">혼자서 10발, 100점 만점 · 최고 기록 저장</p>
  <button id="m2" style="width:100%;margin-top:14px;background:#7b4fe0">👥 친구와 대결 (폰 하나로)</button><p style="font-size:13px;margin:4px 0 0">한 발씩 번갈아 쏘고 폰을 넘겨줘요 · 70m ↔ 100m</p>
  <button id="mN" style="width:100%;margin-top:14px;background:#2f8fd8">⚔️ AI 대결 · 일반</button><p style="font-size:13px;margin:4px 0 0">세트마다 70m ↔ 100m 번갈아</p>
  <button id="mR" style="width:100%;margin-top:12px;background:#e5322d">⚔️ AI 대결 · 실전</button><p style="font-size:13px;margin:4px 0 0">70m 고정 · 한 발 20초 제한 · 바람이 계속 변함<br>손떨림↑ · 실제처럼 느린 화살 · 더 강한 AI</p>`,null,()=>{});
  document.getElementById('cT').onclick=teacherLogin;document.getElementById('cJ').onclick=()=>{audio();joinForm();};
  document.querySelectorAll('.pd').forEach(b=>b.onclick=()=>{audio();ov.classList.add('hide');newGame(false,+b.dataset.d);});
  document.getElementById('mT').onclick=()=>{unlockAll();ttsUnlock();sndOn=true;document.getElementById('mute').textContent='🔊';
    if(sok()){const n=AC.currentTime;cheer(n,0.7);claps(n,1.5,40,0.3);}
    say('소리 테스트. 홍길동 선수 승리!',900);
    const r=document.getElementById('mTr');r.textContent=(AC?'효과음 ✓':'효과음 ✗')+' · '+(TTS?(koVoice()?'한국어 음성 ✓':'음성 기능은 있지만 한국어 목소리를 못 찾았어요'):'이 화면에서는 음성 읽기 기능이 없어요');};
  if(document.getElementById('m2'))document.getElementById('m2').onclick=()=>{audio();nameForm();};
  if(document.getElementById('mN'))document.getElementById('mN').onclick=()=>{audio();ov.classList.add('hide');newGame(false);};
  if(document.getElementById('mR'))document.getElementById('mR').onclick=()=>{audio();ov.classList.add('hide');newGame(true);};
}
newGame(false);if(ROOM)roomMenu();else if(PIN_Q)joinForm();else menu();
requestAnimationFrame(loop);
</script>
<script type="module">
// Firebase 연결 (firebase-config.js 는 같은 폴더나 한 단계 위 폴더에 있으면 돼요)
try{
  const V='https://www.gstatic.com/firebasejs/11.10.0/';
  const [A,Au,S]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
  let cfg=null;for(const p of['./firebase-config.js','../firebase-config.js']){try{cfg=(await import(p)).firebaseConfig;if(cfg&&cfg.apiKey)break;}catch(e){}}
  if(!cfg||!cfg.apiKey)throw new Error('firebase-config.js를 찾지 못했어요');
  const app=A.initializeApp(cfg,'archery-class'),auth=Au.getAuth(app),db=S.getFirestore(app);
  window.FBX={auth,db,S,signIn:()=>Au.signInAnonymously(auth)};
  window.dispatchEvent(new Event('fbx-ready'));
}catch(e){window.FBX_ERR=(e&&e.message)||'연결 실패';window.dispatchEvent(new Event('fbx-error'));}
